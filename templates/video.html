<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园文化创意站 - 视频详情</title>
  <!-- <link rel="stylesheet" href="zongdaohang.css"> -->
  <link rel="stylesheet" href="{{url_for('static',filename="MYcss/video.css")}}">
  <link rel="stylesheet" href="{{url_for('static',filename="MYcss/zongdaohang.css")}}">
</head>
<body>

<!-- 原有导航 -->
<div class="maxtop">
  <a href="/zhuye"><div class="geren"><h5><span id="showName">个人中心</span></h5></div></a>
  <ul class="toplabel">
    <li class="shouye"><h5 class="h5top"><a href="/index">首页</a></h5></li>
    <li class="dongtai"><h5 class="h5top"><a href="/zhuyedongtai">动态</a></h5></li>
    <li class="shoucang"><h5 class="h5top"><a href="/zhuyeshoucang">收藏</a></h5></li>
    <li class="lishi"><h5 class="h5top"><a href="/zhuyelishi">历史</a></h5></li>
    <li class="chuangzuo"><h5 class="h5top"><a href="/tougao">创作中心</a></h5></li>
    <li class="sousuo"><h5 class="h5top"><a href="/search">搜索</a></h5></li>
  </ul>
</div>

<!-- 主体内容 -->
<div class="bili-wrapper">
  <div class="video-layout">
    <!-- 左侧主视频区 -->
    <div class="video-main">
      <div class="player-card">
        <video id="mainVideo" controls poster="">
          <source id="videoSource" src="" type="video/mp4">
          您的浏览器不支持 video 标签。
        </video>
      </div>

      <!-- 留言板卡片 -->
      <div class="bili-card">
        <div class="card-header">
          <span>💬</span> 留言板
        </div>
        <div class="card-content">
          <div class="comment-form">
            <textarea id="commentContent" rows="3" maxlength="600" placeholder="写下你的想法... 友善交流，自由表达（最多600字）"></textarea>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
              <span class="char-count"><span id="charCount">0</span>/600</span>
              <button class="btn-primary" id="publishBtn">发布留言</button>
            </div>
          </div>
          <div id="commentsListContainer">
            <div class="empty-comments">加载留言中...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧信息区 -->
    <div class="video-side">
      <div class="bili-card">
        <div class="card-header">
          <span>🎨</span> 关于作者
        </div>
        <div class="card-content">
          <div class="author-info">
            <div class="author-avatar" id="authorAvatar">U</div>
            <div class="author-name" id="authorName">加载中...</div>
          </div>
           <!-- 关注按钮 -->
        <button class="follow-author-btn" id="followAuthorBtn" data-author-id="" style="width:100%; margin-top:12px; padding:8px; background:#00a1d6; color:white; border:none; border-radius:4px; cursor:pointer;">
            + 关注
        </button>
          <div class="action-buttons">
    <button class="action-btn1" id="likeBtn">👍 点赞 <span id="likeCount">0</span></button>
    
    <!-- 收藏区域 -->
    <div style="display: flex; gap: 5px;">
        <button class="action-btn" id="favBtn">⭐ 收藏</button>
        <select id="folderSelect" style="padding: 8px; border-radius: 6px; border: 1px solid #ddd;">
            <option value="默认收藏夹">默认收藏夹</option>
        </select>
    </div>
</div>
        </div>
      </div>

      <div class="bili-card">
        <div class="card-header">
          <span>📽️</span> 更多作品
        </div>
        <div class="card-content">
          <div id="moreVideoList" class="video-list">
            <div class="empty-comments">加载作品中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{{url_for('static',filename='MYjs/video-global-api.js')}}"></script>
<script src="{{url_for('static',filename='MYjs/video-utils-ui.js')}}"></script>
<script src="{{url_for('static',filename='MYjs/video-comments.js')}}"></script>
<script src="{{url_for('static',filename='MYjs/video-favorite.js')}}"></script>
<script src="{{url_for('static',filename='MYjs/video-main.js')}}"></script>

<script src="{{url_for('static',filename="MYjs/tongyiname.js")}}"></script>

</body>
</html>
