 <hr class="hr1">
 <!-- 动态内容区域 - 显示通知消息 -->
  <div class="box">
     <!-- 左侧：发布动态 -->
    <div class="publish-area">
        <div class="publish-card">
            <h4>📝 发布动态</h4>
            <textarea id="dynamicContent" class="publish-textarea" placeholder="分享你的想法..." maxlength="500"></textarea>
            <div class="publish-footer">
                <div class="image-upload">
                    <label for="dynamicImage" class="upload-btn">📷 添加图片</label>
                    <input type="file" id="dynamicImage" accept="image/*" style="display: none;">
                    <span class="image-name" id="imageName"></span>
                </div>
                <button class="publish-btn" id="publishDynamicBtn">发布</button>
            </div>
            <div class="char-count"><span id="dynamicCharCount">0</span>/500</div>
        </div>
        
        <!-- 图片预览 -->
        <div class="image-preview" id="imagePreview" style="display: none;">
            <img id="previewImg" src="" alt="预览">
            <span class="remove-image" id="removeImage">✕</span>
        </div>
    </div>
    <!-- 右侧：动态列表 -->
<div class="dongtai-content" id="dongtaiContent" style="padding: 20px; max-width: 800px; margin: 0 auto;">
  <h3 style="margin-bottom: 20px;">📢 我的动态</h3>
  <div id="dynamicList">
    <div style="text-align: center; padding: 40px; color: #999;">加载动态中...</div>
  </div>
</div>

<!-- 通知下拉面板 -->
<div class="notification-panel" id="notificationPanel" style="display: none;">
    <div class="panel-header">
        <h4>📬 通知消息</h4>
        <button class="mark-all-read" id="markAllRead">全部已读</button>
    </div>
    <div class="notification-list" id="notificationList">
        <div class="empty-notifications">暂无通知</div>
    </div>
</div>
